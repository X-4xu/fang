name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install package and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check code formatting with Black
      run: |
        black --check fang tests

    - name: Run test suite
      run: |
        pytest -v --tb=short

    - name: Smoke test CLI
      run: |
        fang --help
        python -m fang.cli -l tests/fixtures/auth_classic.log -t 5 -w 60
        python -m fang.cli -l tests/fixtures/auth_rfc3339.log -t 5 -w 60 -o ci_report.json
