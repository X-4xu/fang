<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Fang — SSH Brute-Force Detection Engine</title>
<desc>Project banner for the fang security tool, dark terminal-themed background with the project name, a detection icon, and a tagline describing SSH brute-force log analysis.</desc>

<rect width="1200" height="300" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#30363d" stroke-width="1"/>

<line x1="60" y1="0" x2="60" y2="300" stroke="#21262d" stroke-width="1"/>
<line x1="1140" y1="0" x2="1140" y2="300" stroke="#21262d" stroke-width="1"/>

<g transform="translate(150,95)">
  <rect x="-58" y="-58" width="116" height="116" rx="16" fill="#161b22" stroke="#f78166" stroke-width="1.5"/>
  <path d="M -22 -8 L 0 -30 L 22 -8 L 22 14 Q 22 30 0 38 Q -22 30 -22 14 Z"
        fill="none" stroke="#f78166" stroke-width="3.5" stroke-linejoin="round"/>
  <line x1="-9" y1="4" x2="9" y2="4" stroke="#f78166" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="0" y1="-5" x2="0" y2="13" stroke="#f78166" stroke-width="3.5" stroke-linecap="round"/>
</g>

<text x="230" y="130" font-family="'JetBrains Mono','Courier New',monospace" font-size="72" font-weight="700" fill="#e6edf3">fang</text>
<rect x="472" y="82" width="16" height="52" fill="#f78166">
  <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
</rect>

<text x="232" y="168" font-family="'JetBrains Mono','Courier New',monospace" font-size="20" fill="#8b949e">SSH brute-force detection engine</text>

<g font-family="'JetBrains Mono','Courier New',monospace" font-size="15" fill="#484f58">
  <text x="232" y="205">$ fang -l /var/log/auth.log</text>
  <text x="232" y="228" fill="#3fb950">ALERT  192.168.1.100  5 failed attempts  HIGH</text>
</g>

<g font-family="'JetBrains Mono','Courier New',monospace" font-size="14" fill="#6e7681">
  <text x="1140" y="60" text-anchor="end">24 tests passing</text>
  <text x="1140" y="84" text-anchor="end">zero heavy deps</text>
  <text x="1140" y="108" text-anchor="end">MIT licensed</text>
</g>

<text x="1140" y="255" text-anchor="end" font-family="'JetBrains Mono','Courier New',monospace" font-size="15" fill="#484f58">github.com/X-4xu/fang</text>
</svg>
